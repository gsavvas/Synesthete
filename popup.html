<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Synesthetize</title>
	<link rel="stylesheet" href="mystyles.css">
</head>
<body>
<div id="content" class="popup-content">
	<p>This site is: <span id="hostname_text">hostname</span></p>
	<p>Currently Synesthetize is <span id="status_text" class="popup-status">status_here</span> for this site.</p>
	<button id="disable_page_button" type="button">Turn off/on for site</button>
	<p id="reload_content" class="options-message success" aria-live="polite"></p>
	<p id="unsupported_message" class="popup-unsupported" hidden></p>
</div>
<script src="defaults.js"></script>
<script src="storage-utils.js"></script>
<script src="popup.js"></script>
</body>
</html>
